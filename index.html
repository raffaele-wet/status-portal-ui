<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Accesso</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #eab308;
      --err: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 14px; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; justify-content: center;
    }
    .wrap { width: 100%; max-width: 440px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    h1, h2 { margin: 0 0 10px 0; font-size: 0.96rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 8px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: #0b1220; color: var(--text);
      font-size: 0.92rem;
    }
    button {
      width: 100%; padding: 11px; border-radius: 9px; border: 0;
      background: var(--accent); color: #0b1220; font-weight: 700;
      font-size: 0.9rem; cursor: pointer; margin-top: 10px;
    }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--err); color: #fff; }
    button.ok { background: var(--ok); color: #052e16; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #263348; gap: 8px; }
    .row:last-child { border-bottom: 0; }
    .k { color: var(--muted); font-size: 0.86rem; }
    .v { font-size: 0.88rem; font-weight: 600; text-align: right; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
    .badge.ok { background: rgba(34,197,94,0.2); color: var(--ok); }
    .badge.warn { background: rgba(234,179,8,0.2); color: var(--warn); }
    .badge.err { background: rgba(239,68,68,0.2); color: var(--err); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 10px; }
    .grid button { margin-top: 0; padding: 10px 8px; font-size: 0.88rem; }
    .select-row { display: flex; gap: 8px; margin-top: 10px; }
    .select-row select { flex: 1; }
    .select-row button { width: auto; margin-top: 0; padding: 10px 14px; }
    .msg { font-size: 0.82rem; margin: 0 0 10px 0; min-height: 1.1em; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .topbar button { width: auto; margin: 0; padding: 7px 12px; font-size: 0.8rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="view-login" class="card">
      <h1>Accesso</h1>
      <label for="inp-endpoint">URL</label>
      <input id="inp-endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" />
      <label for="inp-pass">Password</label>
      <input id="inp-pass" type="password" autocomplete="current-password" />
      <button id="btn-login">Entra</button>
      <div id="login-msg" class="msg err" style="margin-top:8px;"></div>
    </div>

    <div id="view-app" class="hidden">
      <div class="topbar">
        <strong id="app-title">Stato</strong>
        <div style="display:flex; gap:6px;">
          <button id="btn-refresh" class="secondary">Aggiorna</button>
          <button id="btn-logout" class="secondary">Esci</button>
        </div>
      </div>
      <div id="app-msg" class="msg"></div>
      <div id="app-cards"></div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_EP = "portal_ep_v1";
      const SESSION_PW = "portal_pw_v1";

      const elLogin = document.getElementById("view-login");
      const elApp = document.getElementById("view-app");
      const inpEp = document.getElementById("inp-endpoint");
      const inpPw = document.getElementById("inp-pass");
      const btnLogin = document.getElementById("btn-login");
      const btnRefresh = document.getElementById("btn-refresh");
      const btnLogout = document.getElementById("btn-logout");
      const loginMsg = document.getElementById("login-msg");
      const appMsg = document.getElementById("app-msg");
      const appTitle = document.getElementById("app-title");
      const appCards = document.getElementById("app-cards");

      inpEp.value = localStorage.getItem(STORAGE_EP) || "";

      async function callRemote(action, params) {
        const endpoint = (localStorage.getItem(STORAGE_EP) || inpEp.value || "").trim();
        const password = sessionStorage.getItem(SESSION_PW) || inpPw.value || "";
        if (!endpoint || !password) throw new Error("Campi mancanti.");
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ password, action, params: params || {} }),
        });
        const data = await res.json();
        if (!data || !data.ok) throw new Error((data && data.error) || "Errore.");
        return data;
      }

      async function runAction(btn, action, params, confirmMsg) {
        if (confirmMsg && !window.confirm(confirmMsg)) return;
        if (btn) btn.disabled = true;
        appMsg.className = "msg";
        appMsg.textContent = "...";
        try {
          renderPayload(await callRemote(action, params));
        } catch (err) {
          appMsg.className = "msg err";
          appMsg.textContent = err.message;
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function renderPayload(data) {
        appTitle.textContent = data.title || "Stato";
        appMsg.className = "msg ok";
        appMsg.textContent = data.notice || "";
        appCards.innerHTML = "";

        (data.sections || []).forEach(function (sec) {
          const card = document.createElement("div");
          card.className = "card";
          if (sec.title) {
            const h2 = document.createElement("h2");
            h2.textContent = sec.title;
            card.appendChild(h2);
          }

          (sec.rows || []).forEach(function (r) {
            const row = document.createElement("div");
            row.className = "row";
            const k = document.createElement("span");
            k.className = "k";
            k.textContent = r.label || "";
            const v = document.createElement("span");
            v.className = r.badge ? ("badge " + r.badge) : "v";
            v.textContent = r.value != null ? String(r.value) : "-";
            row.appendChild(k);
            row.appendChild(v);
            card.appendChild(row);
          });

          if (sec.select && sec.select.options && sec.select.options.length) {
            const sRow = document.createElement("div");
            sRow.className = "select-row";
            const sel = document.createElement("select");
            sec.select.options.forEach(function (opt) {
              const o = document.createElement("option");
              o.value = opt.value;
              o.textContent = opt.label;
              if (opt.selected) o.selected = true;
              sel.appendChild(o);
            });
            const sb = document.createElement("button");
            sb.textContent = sec.select.buttonLabel || "OK";
            sb.className = sec.select.style || "secondary";
            sb.addEventListener("click", function () {
              const p = Object.assign({}, sec.select.params || {});
              p[sec.select.paramKey || "value"] = sel.value;
              runAction(sb, sec.select.action, p, sec.select.confirm);
            });
            sRow.appendChild(sel);
            sRow.appendChild(sb);
            card.appendChild(sRow);
          }

          if (sec.actions && sec.actions.length) {
            const grid = document.createElement("div");
            grid.className = "grid";
            sec.actions.forEach(function (act) {
              const b = document.createElement("button");
              b.textContent = act.label;
              if (act.style) b.className = act.style;

              if (act.upload) {
                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = act.accept || ".md,.txt,text/plain,text/markdown";
                fileInput.className = "hidden";
                fileInput.addEventListener("change", function () {
                  const f = fileInput.files && fileInput.files[0];
                  fileInput.value = "";
                  if (!f) return;
                  const reader = new FileReader();
                  reader.onload = function () {
                    const p = Object.assign({}, act.params || {});
                    p[act.contentKey || "content"] = String(reader.result || "");
                    runAction(b, act.action, p, act.confirm);
                  };
                  reader.readAsText(f, "utf-8");
                });
                card.appendChild(fileInput);
                b.addEventListener("click", function () { fileInput.click(); });
              } else {
                b.addEventListener("click", function () {
                  runAction(b, act.action, act.params, act.confirm);
                });
              }

              grid.appendChild(b);
            });
            card.appendChild(grid);
          }

          appCards.appendChild(card);
        });
      }

      async function doLogin() {
        loginMsg.textContent = "";
        btnLogin.disabled = true;
        try {
          localStorage.setItem(STORAGE_EP, inpEp.value.trim());
          sessionStorage.setItem(SESSION_PW, inpPw.value);
          const data = await callRemote("status", {});
          elLogin.classList.add("hidden");
          elApp.classList.remove("hidden");
          renderPayload(data);
        } catch (err) {
          sessionStorage.removeItem(SESSION_PW);
          loginMsg.textContent = err.message;
        } finally {
          btnLogin.disabled = false;
        }
      }

      btnLogin.addEventListener("click", doLogin);
      inpPw.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
      btnRefresh.addEventListener("click", function () { runAction(btnRefresh, "status", {}, null); });
      btnLogout.addEventListener("click", function () {
        sessionStorage.removeItem(SESSION_PW);
        inpPw.value = "";
        appCards.innerHTML = "";
        elApp.classList.add("hidden");
        elLogin.classList.remove("hidden");
      });
    })();
  </script>
</body>
</html>
